name: Publish Ukrainian DNS feed

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
    inputs:
      bootstrap:
        description: 'Allow first publication only when no prior feed exists (HTTP 404)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ua-adblock-pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Keep scheduled workflow active without committing generated data
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          last_commit=$(git log -1 --format=%ct)
          now=$(date +%s)
          if (( now - last_commit >= 30 * 86400 )); then
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit --allow-empty -m 'Keep scheduled feed updates active'
            gh auth setup-git
            git push origin HEAD:main
          fi
      - name: Run all regression tests
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -v
      - name: Build validated public files outside checkout
        env:
          BOOTSTRAP: ${{ inputs.bootstrap || false }}
        shell: bash
        run: |
          args=()
          if [[ "$BOOTSTRAP" == "true" ]]; then args+=(--bootstrap); fi
          python3 scripts/prepare_ua_adlist_feed.py \
            --output-dir "$RUNNER_TEMP/public-feed" \
            --previous-url "https://ben-3310.github.io/ua-adblock-feed/relatives-ua-ads.txt" \
            "${args[@]}"
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/public-feed
          retention-days: 1
      - name: Deploy complete validated artifact
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
